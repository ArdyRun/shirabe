<!doctype html>
<html lang="id" data-theme-pending>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shirabe</title>
  </head>
  <body>
    <main class="action">
      <header class="action__header">
        <div>
          <h1 class="action__title" data-i18n="app.name">Shirabe</h1>
          <p class="note" data-i18n="app.tagline">Kamus Jepang kontekstual dengan lookup lokal</p>
        </div>
        <span id="status-badge" class="status" role="status"></span>
      </header>

      <form id="search-form" class="stack" role="search">
        <label class="note" for="search-input" data-i18n="action.searchPlaceholder">Cari kata Jepang…</label>
        <div class="row">
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            data-i18n-placeholder="action.searchPlaceholder"
            placeholder="Cari kata Jepang…"
            style="flex: 1; min-width: 0"
          />
          <button id="search-button" class="button button--primary" type="submit" data-i18n="action.search">
            Cari
          </button>
        </div>
        <div class="row">
          <button id="selection-button" class="button" type="button" data-i18n="action.searchSelection">
            Cari teks terpilih
          </button>
          <button id="site-button" class="button" type="button" hidden></button>
        </div>
      </form>

      <section id="notice" class="card" hidden></section>
      <section id="results" class="stack" aria-live="polite"></section>
      <p id="hint" class="note"></p>

      <footer class="action__footer">
        <span id="storage-note" class="note"></span>
        <button id="settings-button" class="button" type="button" data-i18n="action.openSettings">
          Pengaturan
        </button>
      </footer>
    </main>
    <script type="module" src="./action/index.ts"></script>
  </body>
</html>
